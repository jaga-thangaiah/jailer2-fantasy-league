<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EKEY Hive Blueprint</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header id="toolbar">
  <div class="toolbar-group toolbar-title">
    <span class="title-main">EKEY ALLIANCE</span>
    <span class="title-sub">HIVE PLACEMENT BLUEPRINT &mdash; DWG.01</span>
  </div>

  <div class="toolbar-group">
    <label class="field">R3 count
      <input type="number" id="input-r3" min="0" max="200" value="38" />
    </label>
    <label class="field">R2 count
      <input type="number" id="input-r2" min="0" max="200" value="30" />
    </label>
    <label class="field">R1 count
      <input type="number" id="input-r1" min="0" max="200" value="21" />
    </label>
    <button id="btn-regenerate" class="btn btn-primary">Regenerate</button>
  </div>

  <div class="toolbar-group">
    <button id="btn-edit-mode" class="btn">Edit Layout</button>
    <button id="btn-grid" class="btn">Toggle Grid</button>
    <button id="btn-reset-view" class="btn">Reset View</button>
    <button id="btn-export-svg" class="btn">Export SVG</button>
    <button id="btn-export-png" class="btn">Export PNG (4K)</button>
  </div>

  <div class="toolbar-group toolbar-hint">
    <span id="hint-text">Double-click any base to rename it. Turn on Edit Layout, then click two bases to swap their positions.</span>
  </div>
</header>

<main id="stage">
  <div id="viewport-container">
    <svg id="blueprint" viewBox="0 0 1600 1600" xmlns="http://www.w3.org/2000/svg">
      <g id="viewport" transform="translate(0,0) scale(1)">
        <rect id="background" x="0" y="0" width="1600" height="1600" fill="#78A950"></rect>
        <g id="grid-layer"></g>
        <g id="city-layer"></g>
        <g id="hive-layer"></g>
        <g id="selection-layer"></g>
      </g>
    </svg>
  </div>

  <div id="readout-panel">
    <div id="tile-readout">Tile: &mdash;</div>
    <div id="stat-readout">Bases: &mdash;</div>
  </div>
</main>

<div id="rename-backdrop" class="hidden">
  <div id="rename-box">
    <label for="rename-input">Rename base</label>
    <input type="text" id="rename-input" maxlength="24" autocomplete="off" />
    <div class="rename-actions">
      <button id="rename-cancel" class="btn">Cancel</button>
      <button id="rename-confirm" class="btn btn-primary">Rename</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
